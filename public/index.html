<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vynl — твой музыкальный плеер</title>
<style>
  /* ==========================================================
     VYNL · тема «Aurora»
     Матовое стекло поверх живого сияющего фона.
     Светлая тема — база, тёмная и ручной выбор темы переопределяют токены.
     ========================================================== */
  :root{
    --bg:#e7eaf4;
    --text:#12141d;
    --dim:#5f6579;
    --accent:#6a5cff;
    --accent-2:#48cebe;
    --glass:rgba(255,255,255,.6);
    --glass-strong:rgba(255,255,255,.72);
    --glass-line:rgba(255,255,255,.85);
    --card:rgba(255,255,255,.5);
    --card-hover:rgba(255,255,255,.72);
    --gA:rgba(96,150,255,.30);
    --gB:rgba(150,110,240,.24);
    --gC:rgba(72,206,190,.20);
    --shadow:0 22px 54px rgba(60,70,130,.20);
    --danger:#d6455f;
    --ok:#1f9d78;
    --modal-bg:rgba(248,249,253,.97);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#070912; --text:#eef1f8; --dim:#8890a4; --accent:#8f82ff; --accent-2:#54d8c6;
      --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.09);
      --glass-line:rgba(255,255,255,.12); --card:rgba(255,255,255,.05); --card-hover:rgba(255,255,255,.1);
      --gA:rgba(80,130,255,.24); --gB:rgba(150,90,240,.20); --gC:rgba(60,200,180,.16);
      --shadow:0 22px 54px rgba(0,0,0,.55); --danger:#ff7089; --ok:#4fd6a8; --modal-bg:rgba(18,20,32,.97);
    }
  }
  :root[data-theme="dark"]{
    --bg:#070912; --text:#eef1f8; --dim:#8890a4; --accent:#8f82ff; --accent-2:#54d8c6;
    --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.09);
    --glass-line:rgba(255,255,255,.12); --card:rgba(255,255,255,.05); --card-hover:rgba(255,255,255,.1);
    --gA:rgba(80,130,255,.24); --gB:rgba(150,90,240,.20); --gC:rgba(60,200,180,.16);
    --shadow:0 22px 54px rgba(0,0,0,.55); --danger:#ff7089; --ok:#4fd6a8; --modal-bg:rgba(18,20,32,.97);
  }
  :root[data-theme="light"]{
    --bg:#e7eaf4; --text:#12141d; --dim:#5f6579; --accent:#6a5cff; --accent-2:#48cebe;
    --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.72);
    --glass-line:rgba(255,255,255,.85); --card:rgba(255,255,255,.5); --card-hover:rgba(255,255,255,.72);
    --gA:rgba(96,150,255,.30); --gB:rgba(150,110,240,.24); --gC:rgba(72,206,190,.20);
    --shadow:0 22px 54px rgba(60,70,130,.20); --danger:#d6455f; --ok:#1f9d78; --modal-bg:rgba(248,249,253,.97);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* Живое сияние-аврора за всем интерфейсом */
  body::before{
    content:'';
    position:fixed; inset:-40%;
    z-index:0; pointer-events:none;
    background:
      radial-gradient(closest-side, var(--gA), transparent 70%) 15% 10%/55% 55% no-repeat,
      radial-gradient(closest-side, var(--gB), transparent 70%) 85% 25%/60% 60% no-repeat,
      radial-gradient(closest-side, var(--gC), transparent 70%) 55% 95%/55% 55% no-repeat;
    animation:aurora-drift 18s ease-in-out infinite alternate;
  }
  @keyframes aurora-drift{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(4%,-3%) scale(1.08);}
    100%{transform:translate(-3%,4%) scale(1.04);}
  }

  /* Нижний отступ резервирует место под плавающий плеер, чтобы он не перекрывал сайдбар (и кнопку «Войти») */
  .app{ display:flex; flex:1; min-height:0; position:relative; z-index:1; padding:16px 16px 114px; gap:16px; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:236px;
    background:var(--glass);
    border:1px solid var(--glass-line);
    border-radius:22px;
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    padding:24px 20px;
    display:flex; flex-direction:column; gap:26px;
    box-shadow:var(--shadow);
  }
  .brand{ display:inline-flex; align-self:center; align-items:center; justify-content:center; gap:11px; cursor:pointer; padding:2px; border-radius:12px; }
  .brand:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .brand-mark{
    width:36px; height:36px; border-radius:11px;
    background:conic-gradient(from 45deg, #6096ff, #9670f0, #48cebe, #6096ff);
    box-shadow:0 4px 14px rgba(106,92,255,.4);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .brand:hover .brand-mark{
    transform:scale(1.08) rotate(-4deg);
    box-shadow:0 0 0 4px rgba(106,92,255,.18), 0 8px 24px rgba(106,92,255,.6);
  }

  nav{ display:flex; flex-direction:column; gap:3px; }
  .nav-item{
    padding:9px 12px; border-radius:12px; color:var(--dim);
    font-size:14px; font-weight:500; cursor:pointer; transition:.15s;
    display:flex; align-items:center; gap:11px;
  }
  .nav-item svg{ width:18px; height:18px; opacity:.85; }
  .nav-item:hover{ background:var(--card); color:var(--text); }
  .nav-item.active{ background:var(--card); color:var(--text); font-weight:600; box-shadow:inset 0 0 0 1px var(--glass-line); }
  .nav-item.active svg{ color:var(--accent); opacity:1; }

  .playlists{ display:flex; flex-direction:column; gap:2px; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--glass-line) transparent; }
  .playlists::-webkit-scrollbar{ width:5px; }
  .playlists::-webkit-scrollbar-thumb{ background:var(--glass-line); border-radius:3px; }
  .playlists::-webkit-scrollbar-track{ background:transparent; }
  .playlists h3{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.18em; color:var(--dim);
    font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
  }
  .playlists h3 button{ background:none; border:none; color:var(--dim); cursor:pointer; font-size:16px; line-height:1; }
  .playlists h3 button:hover{ color:var(--accent); }
  .playlist-item{ padding:7px 12px; margin:0 -8px; border-radius:10px; font-size:13.5px; color:var(--dim); cursor:pointer; }
  .playlist-item:hover{ background:var(--card); color:var(--text); }

  .auth-area{ border-top:1px solid var(--glass-line); padding-top:16px; }
  .auth-user-row{ display:flex; align-items:center; gap:10px; }
  .auth-ava{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(from 45deg, #6096ff, #9670f0, #48cebe, #6096ff);
    color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .auth-username{ font-size:13.5px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .auth-logout-btn{ background:none; border:none; color:var(--dim); font-size:12px; cursor:pointer; }
  .auth-logout-btn:hover{ color:var(--text); }

  /* ---------- MAIN ---------- */
  main{ flex:1; overflow-y:auto; padding:8px 26px 24px; min-width:0; }

  /* Верхняя строка: приветствие + переключатель темы */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; }
  .greeting{ font-size:13px; color:var(--dim); }
  .theme-toggle{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    background:var(--glass); border:1px solid var(--glass-line);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle:hover{ color:var(--accent); }

  /* Герой «Сейчас играет» */
  .hero{
    display:flex; gap:24px; align-items:center;
    background:var(--glass); border:1px solid var(--glass-line); border-radius:26px;
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    padding:24px; margin-bottom:30px; box-shadow:var(--shadow);
  }
  .hero-cover{
    width:132px; height:132px; border-radius:18px; flex-shrink:0;
    box-shadow:var(--shadow); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 6px rgba(0,0,0,.3);
  }
  .hero-body{ min-width:0; }
  .hero-eyebrow{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .hero-title{ font-size:32px; font-weight:700; letter-spacing:-.02em; margin:6px 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hero-artist{ color:var(--dim); font-size:14px; margin-bottom:16px; }
  .hero-eq{ display:flex; align-items:flex-end; gap:4px; height:22px; }
  .hero-eq span{ width:4px; background:var(--accent); border-radius:2px; height:30%; animation:eq 1.1s ease-in-out infinite; animation-play-state:paused; }
  .hero-eq.playing span{ animation-play-state:running; }
  .hero-eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .hero-eq span:nth-child(2){ height:90%; animation-delay:.2s; }
  .hero-eq span:nth-child(3){ height:60%; animation-delay:.4s; }
  .hero-eq span:nth-child(4){ height:100%; animation-delay:.1s; }
  .hero-eq span:nth-child(5){ height:50%; animation-delay:.3s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.4); } 50%{ transform:scaleY(1); } }

  /* Заголовок секции + действия */
  .section-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .section-title{ font-size:19px; font-weight:700; display:flex; align-items:center; gap:12px; }
  .back-link{ font-size:13px; font-weight:500; color:var(--dim); cursor:pointer; }
  .back-link:hover{ color:var(--accent); }
  .section-actions{ display:flex; align-items:center; gap:10px; }
  .search-input{
    background:var(--card); border:1px solid var(--glass-line); color:var(--text);
    padding:9px 14px; border-radius:12px; font-size:14px; font-family:inherit; width:230px;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .search-input:focus{ outline:none; border-color:var(--accent); }
  .search-input::placeholder{ color:var(--dim); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:18px; }
  .track-card{
    background:var(--card); border:1px solid var(--glass-line); border-radius:16px;
    padding:12px; cursor:pointer; transition:transform .18s ease, background .15s;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .track-card:hover{ transform:translateY(-4px); background:var(--card-hover); }
  .cover{
    width:100%; aspect-ratio:1; border-radius:11px; margin-bottom:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; color:rgba(255,255,255,.92); text-shadow:0 1px 6px rgba(0,0,0,.3);
    position:relative;
  }
  .track-title{ font-size:14px; font-weight:600; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-artist{ font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-card.playing .track-title{ color:var(--accent); }

  .add-to-playlist-btn{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(10,12,20,.5); border:none; color:#fff; font-size:16px; line-height:1;
    cursor:pointer; opacity:0; transition:.15s; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .track-card:hover .add-to-playlist-btn{ opacity:1; }
  .add-to-playlist-btn:hover{ background:var(--accent); }

  .delete-track-btn{
    position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(10,12,20,.5); border:none; color:#fff; font-size:13px; line-height:1;
    cursor:pointer; opacity:0; transition:.15s; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .track-card:hover .delete-track-btn{ opacity:1; }
  .delete-track-btn:hover{ background:var(--danger); }

  .track-artist.linkable{ cursor:pointer; }
  .track-artist.linkable:hover{ color:var(--accent); text-decoration:underline; }

  .auth-username{ cursor:pointer; }
  .auth-username:hover{ text-decoration:underline; }

  .track-stats{ display:flex; align-items:center; gap:12px; margin-top:6px; }
  .stat-btn{
    display:flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer;
    color:var(--dim); font-size:12px; padding:2px; border-radius:6px; transition:color .15s;
  }
  .stat-btn:hover{ color:var(--text); }
  .stat-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .stat-btn.active{ color:var(--accent); }

  .profile-header{ display:flex; align-items:center; gap:14px; margin:-10px 0 16px; font-size:13px; color:var(--dim); }

  .similar-artists{ align-items:center; gap:8px; flex-wrap:wrap; margin:-8px 0 16px; font-size:12.5px; color:var(--dim); }
  .similar-artists .chip{
    padding:4px 12px; border-radius:999px; background:var(--card); cursor:pointer; color:var(--text);
    border:1px solid var(--glass-line); transition:.15s;
  }
  .similar-artists .chip:hover{ color:var(--accent); border-color:var(--accent); }

  .track-meta{ font-size:11.5px; color:var(--dim); margin-top:2px; }
  .repost-badge{ font-size:11px; color:var(--accent); margin-bottom:4px; }

  .admin-reports{ display:flex; flex-direction:column; gap:12px; max-width:520px; }
  .report-item{
    background:var(--card); border:1px solid var(--glass-line); border-radius:14px;
    padding:16px; font-size:13.5px;
  }
  .report-item .report-reason{ color:var(--dim); font-size:12.5px; margin-top:4px; }

  .comments-list{ max-height:280px; overflow-y:auto; margin:14px 0; display:flex; flex-direction:column; gap:11px; }
  .comment-item{ font-size:13px; line-height:1.4; }
  .comment-author{ font-weight:600; color:var(--text); margin-right:6px; }
  .comment-text{ color:var(--dim); }
  .comment-empty{ color:var(--dim); font-size:12.5px; }

  .add-to-playlist-popover{
    display:none; position:fixed; z-index:60;
    background:var(--modal-bg); border:1px solid var(--glass-line); border-radius:14px; padding:6px; min-width:190px;
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:var(--shadow);
  }
  .add-to-playlist-popover.open{ display:block; }
  .popover-item{ padding:8px 11px; border-radius:9px; font-size:13px; cursor:pointer; color:var(--text); }
  .popover-item:hover{ background:var(--card); }
  .popover-empty{ padding:8px 11px; font-size:12.5px; color:var(--dim); }

  /* ---------- PLAYER BAR (плавающая стеклянная панель) ---------- */
  .player-bar{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:5;
    height:82px;
    background:var(--glass); border:1px solid var(--glass-line); border-radius:20px;
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:var(--shadow);
    display:flex; align-items:center; padding:0 22px; gap:22px;
  }
  .now-playing{ display:flex; align-items:center; gap:13px; width:250px; min-width:0; }
  .np-cover{
    width:52px; height:52px; border-radius:11px; flex-shrink:0; background:var(--card);
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .now-playing-info{ min-width:0; }
  .now-playing-title{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-playing-artist{ font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .controls{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; max-width:560px; margin:0 auto; }
  .control-buttons{ display:flex; align-items:center; gap:18px; }
  .btn-icon{ background:none; border:none; color:var(--text); cursor:pointer; opacity:.82; transition:.15s; padding:4px; display:flex; }
  .btn-icon:hover{ opacity:1; }
  .play-btn{
    width:40px; height:40px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    opacity:1; cursor:pointer; box-shadow:0 8px 22px rgba(106,92,255,.4);
  }
  .play-btn:hover{ transform:scale(1.05); }

  .progress-row{ display:flex; align-items:center; gap:11px; width:100%; }
  .time{ font-size:11px; color:var(--dim); width:36px; font-variant-numeric:tabular-nums; }
  .time.right{ text-align:right; }
  .progress-track{ flex:1; height:5px; background:var(--card); border:1px solid var(--glass-line); border-radius:3px; position:relative; cursor:pointer; }
  .progress-fill{ position:absolute; left:-1px; top:-1px; bottom:-1px; height:auto; background:linear-gradient(90deg,#6096ff,#9670f0); border-radius:3px; width:0%; }

  .volume-row{ width:150px; display:flex; align-items:center; gap:9px; justify-content:flex-end; color:var(--dim); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:96px; height:5px; background:var(--card); border:1px solid var(--glass-line); border-radius:3px; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(106,92,255,.5); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border:none; border-radius:50%; background:var(--accent); cursor:pointer; }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--card-hover); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- КНОПКИ / ФОРМЫ ---------- */
  .btn-glass{
    background:var(--card); color:var(--text); border:1px solid var(--glass-line);
    padding:9px 16px; border-radius:12px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:.15s;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .btn-glass:hover{ background:var(--card-hover); color:var(--accent); }

  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(6,9,18,.55);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    align-items:center; justify-content:center; z-index:50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--modal-bg); border:1px solid var(--glass-line); border-radius:20px;
    backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); box-shadow:var(--shadow);
    padding:28px 28px 22px; width:370px; max-height:88vh; overflow-y:auto;
  }
  select.form-input{ appearance:none; cursor:pointer; }
  textarea.form-input{ resize:vertical; min-height:60px; font-family:inherit; }
  .checkbox-row{
    display:flex; align-items:center; gap:8px; margin:14px 0 0; font-size:12.5px;
    color:var(--dim); cursor:pointer; user-select:none;
  }
  .checkbox-row input{ cursor:pointer; }
  .modal h3{ font-size:20px; font-weight:700; margin-bottom:18px; }
  .form-label{ display:block; font-size:12.5px; color:var(--dim); margin:14px 0 6px; font-weight:600; }
  .form-label:first-of-type{ margin-top:0; }
  .form-input{
    width:100%; background:var(--card); border:1px solid var(--glass-line); color:var(--text);
    padding:10px 12px; border-radius:11px; font-size:14px; font-family:inherit;
  }
  .form-input:focus{ outline:none; border-color:var(--accent); }
  .form-input::file-selector-button{
    background:var(--card-hover); border:none; color:var(--text); font-family:inherit;
    padding:6px 12px; border-radius:8px; margin-right:10px; cursor:pointer;
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn-secondary, .btn-primary{ padding:10px 18px; border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer; border:none; font-family:inherit; }
  .btn-secondary{ background:none; color:var(--dim); }
  .btn-secondary:hover{ color:var(--text); }
  .btn-primary{ background:var(--accent); color:#fff; box-shadow:0 8px 22px rgba(106,92,255,.35); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.6; cursor:not-allowed; }
  .upload-status{ font-size:12.5px; margin-top:12px; color:var(--dim); min-height:16px; }
  .upload-status.error{ color:var(--danger); }
  .upload-status.success{ color:var(--ok); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<!-- Мини-меню «добавить трек в плейлист» -->

<div class="player-bar">

      </button>

      <span class="time right" id="time-total">0:00</span>
    </div>
  </div>

  <div class="volume-row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
    <input type="range" id="volume" min="0" max="100" value="70">
  </div>
</div>

<audio id="audio"></audio>

<script>
  // ---------- Тема (светлая / тёмная), выбор запоминается ----------
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('vynl-theme'); } catch(e){}
    if (saved) document.documentElement.setAttribute('data-theme', saved);

    var sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    var moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
    var icon = document.getElementById('theme-icon');

    function isDark(){
      var t = document.documentElement.getAttribute('data-theme');
      if (t) return t === 'dark';
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function syncIcon(){ icon.innerHTML = isDark() ? sun : moon; }
    syncIcon();

    document.getElementById('theme-toggle').addEventListener('click', function(){
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('vynl-theme', next); } catch(e){}
      syncIcon();
    });
  })();

  // ---------- Данные треков берём с сервера ----------
  let tracks = [];
  let libraryTracks = [];   // полный список библиотеки — нужен для поиска и возврата на главную
  let currentUser = null;   // кто сейчас вошёл (или null) — нужно, чтобы знать, чьи треки можно удалять

  async function loadTracksFromServer(){
    const response = await fetch('/api/tracks');
    tracks = await response.json();
    libraryTracks = tracks.slice();
    renderTrackCards();
  }

  const grid = document.getElementById('track-grid');
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const heroCover = document.getElementById('hero-cover');
  const heroTitle = document.getElementById('hero-title');
  const heroArtist = document.getElementById('hero-artist');
  const heroEq = document.getElementById('hero-eq');
  const npCover = document.getElementById('np-cover');
  const npTitle = document.getElementById('np-title');
  const npArtist = document.getElementById('np-artist');
  const progressFill = document.getElementById('progress-fill');
  const progressTrack = document.getElementById('progress-track');
  const timeCurrent = document.getElementById('time-current');
  const timeTotal = document.getElementById('time-total');
  const volume = document.getElementById('volume');

  let currentIndex = -1;
  let isPlaying = false;

  function initials(title){ return title.trim().slice(0,2).toUpperCase(); }

  // Обложка — мягкий градиент из цвета трека, чтобы стекло смотрелось объёмно.
  function coverBg(color){ return 'linear-gradient(150deg, ' + color + ', rgba(7,9,18,0.85))'; }

  // Комментарии — это свободный текст, который вводит пользователь, поэтому его
  // нельзя просто вставлять в innerHTML как есть: кто-нибудь мог бы написать
  // комментарий вида "<img onerror=...>" и выполнить свой код в чужом браузере (XSS).
  // Через textContent браузер сам превращает опасные символы в безопасный текст.
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const HEART_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.33-8.2C1 10.28 1.5 6.9 4.36 5.36 6.6 4.16 9 4.9 12 7.5c3-2.6 5.4-3.34 7.64-2.14C22.5 6.9 23 10.28 21.33 12.8 18.7 16.65 12 21 12 21z"/></svg>';
  const COMMENT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
  const REPOST_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
  const FLAG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 1-1h13l-2.5 5L20 13H5"/></svg>';

  function renderTrackCards(){
    // Сетка треков и экран админ-жалоб взаимоисключающие — если рисуем
    // карточки, значит точно не на экране жалоб, и сетку нужно вернуть.
    grid.style.display = '';
    hideAdminReports();

    grid.innerHTML = '';
    tracks.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'track-card';
      card.id = 'card-' + i;

      // Кнопку удаления показываем только на треках, которые загрузил я сам.
      const canDelete = currentUser && t.user_id === currentUser.id;
      // Имя исполнителя кликабельно только если у трека вообще есть владелец-аккаунт
      // (у демо-треков owner_username не приходит с сервера — там некуда вести).
      const artistLinkable = !!t.owner_username;

      // Если загружена настоящая обложка — показываем её картинкой на всю плитку,
      // иначе (как и раньше) — цветной градиент с буквами названия.
      // cover_path сделан из имени файла, который выбрал пользователь при загрузке —
      // это чужой ввод, поэтому подставлять его строкой прямо в HTML-атрибут style="..."
      // небезопасно (кавычка в имени файла могла бы "вырваться" из атрибута и добавить
      // свой обработчик вроде onclick). Поэтому для обложки фон выставляется отдельно
      // ниже через свойство style.backgroundImage — это не проходит через HTML-парсер.
      const coverStyle = t.cover_path ? '' : `background:${coverBg(t.color)}`;
      const coverLabel = t.cover_path ? '' : initials(t.title);

      // Жанр, длительность и число прослушиваний — короткая строка под именем исполнителя.
      const metaParts = [];
      if (t.genre) metaParts.push(escapeHtml(t.genre));
      if (t.duration) metaParts.push(fmt(t.duration));
      metaParts.push((t.play_count || 0) + ' ▶');
      if (t.is_private) metaParts.push('🔒 приватный');

      // reposted_by приходит только у карточек из ленты (там это репост от
      // кого-то, на кого я подписан) — в остальных списках его просто нет.
      const repostBadge = t.reposted_by
        ? `<div class="repost-badge">${REPOST_ICON} Репостнул(а) ${escapeHtml(t.reposted_by)}</div>`
        : '';

      card.innerHTML = `
        ${repostBadge}
        <div class="cover" style="${coverStyle}">
          ${coverLabel}
          <button class="add-to-playlist-btn" data-track-id="${t.id}" title="Добавить в плейлист">+</button>
          ${canDelete ? `<button class="delete-track-btn" data-track-id="${t.id}" title="Удалить трек">✕</button>` : ''}
        </div>
        <div class="track-title">${t.title}</div>
        <div class="track-artist${artistLinkable ? ' linkable' : ''}">${t.artist}</div>
        <div class="track-meta">${metaParts.join(' · ')}</div>
        <div class="track-stats">
          <button class="stat-btn like-btn${t.liked_by_me ? ' active' : ''}" title="Нравится">
            ${HEART_ICON}<span class="stat-count">${t.like_count || 0}</span>
          </button>
          <button class="stat-btn comment-btn" title="Комментарии">
            ${COMMENT_ICON}<span class="stat-count">${t.comment_count || 0}</span>
          </button>
          <button class="stat-btn repost-btn${t.reposted_by_me ? ' active' : ''}" title="Репост">
            ${REPOST_ICON}<span class="stat-count">${t.repost_count || 0}</span>
          </button>
          ${canDelete ? '' : `<button class="stat-btn report-btn" title="Пожаловаться">${FLAG_ICON}</button>`}
        </div>
      `;

      if (t.cover_path){
        const coverEl = card.querySelector('.cover');
        coverEl.style.backgroundImage = "url('" + t.cover_path + "')";
        coverEl.style.backgroundSize = 'cover';
        coverEl.style.backgroundPosition = 'center';
      }

      card.addEventListener('click', () => loadTrack(i, true));
      card.querySelector('.add-to-playlist-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        openAddToPlaylistPopover(e.currentTarget, t.id);
      });

      const deleteBtn = card.querySelector('.delete-track-btn');
      if (deleteBtn){
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteTrack(t.id);
        });
      }

      if (artistLinkable){
        card.querySelector('.track-artist').addEventListener('click', (e) => {
          e.stopPropagation();
          openProfileView(t.owner_username);
        });
      }

      card.querySelector('.like-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLike(t);
      });
      card.querySelector('.comment-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        openCommentsModal(t);
      });
      card.querySelector('.repost-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleRepost(t);
      });

      const reportBtn = card.querySelector('.report-btn');
      if (reportBtn){
        reportBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          reportTrack(t.id);
        });
      }

      grid.appendChild(card);
    });
  }

  async function reportTrack(trackId){
    if (!currentUser){ openAuthModal(); return; }
    const reason = prompt('Почему жалуетесь на этот трек?');
    if (!reason || !reason.trim()) return;

    const response = await fetch(`/api/tracks/${trackId}/report`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: reason.trim() })
    });
    alert(response.ok ? 'Жалоба отправлена.' : 'Не получилось отправить жалобу.');
  }

  // Репост обновляется точно так же "оптимистично", как и лайк (см. toggleLike ниже).
  async function toggleRepost(t){
    if (!currentUser){ openAuthModal(); return; }

    const method = t.reposted_by_me ? 'DELETE' : 'POST';
    const response = await fetch(`/api/tracks/${t.id}/repost`, { method });
    if (!response.ok) return;

    t.reposted_by_me = !t.reposted_by_me;
    t.repost_count = (t.repost_count || 0) + (t.reposted_by_me ? 1 : -1);

    const libT = libraryTracks.find(x => x.id === t.id);
    if (libT && libT !== t){
      libT.reposted_by_me = t.reposted_by_me;
      libT.repost_count = t.repost_count;
    }

    renderTrackCards();
  }

  // Лайк/дизлайк обновляем "оптимистично" — сразу в объекте трека и на экране,
  // не дожидаясь нового запроса всего списка треков. Так это одинаково работает
  // и в библиотеке, и в ленте, и в профиле, и в плейлисте — где угодно, где t пришёл с сервера.
  async function toggleLike(t){
    if (!currentUser){ openAuthModal(); return; }

    const method = t.liked_by_me ? 'DELETE' : 'POST';
    const response = await fetch(`/api/tracks/${t.id}/like`, { method });
    if (!response.ok) return;

    t.liked_by_me = !t.liked_by_me;
    t.like_count = (t.like_count || 0) + (t.liked_by_me ? 1 : -1);

    // Тот же трек может одновременно храниться в libraryTracks (полная библиотека) —
    // синхронизируем и его, чтобы счётчик не "откатился" при возврате в библиотеку.
    const libT = libraryTracks.find(x => x.id === t.id);
    if (libT && libT !== t){
      libT.liked_by_me = t.liked_by_me;
      libT.like_count = t.like_count;
    }

    renderTrackCards();
  }

  async function deleteTrack(trackId){
    if (!confirm('Удалить этот трек? Это действие нельзя отменить.')) return;
    const response = await fetch(`/api/tracks/${trackId}`, { method: 'DELETE' });
    if (!response.ok){
      alert('Не получилось удалить трек.');
      return;
    }
    await loadTracksFromServer();
  }

  // ---------- Комментарии ----------
  const commentsModalBackdrop = document.getElementById('comments-modal-backdrop');
  const commentsModalTitle = document.getElementById('comments-modal-title');
  const commentsList = document.getElementById('comments-list');
  const commentForm = document.getElementById('comment-form');
  const commentInput = document.getElementById('comment-input');
  const commentStatus = document.getElementById('comment-status');

  let activeCommentsTrack = null; // трек, комментарии которого сейчас открыты

  async function openCommentsModal(t){
    activeCommentsTrack = t;
    commentsModalTitle.textContent = 'Комментарии: ' + t.title;
    commentsList.innerHTML = '<div class="comment-empty">Загрузка…</div>';
    commentStatus.textContent = '';
    commentsModalBackdrop.classList.add('open');
    await loadComments(t.id);
  }

  async function loadComments(trackId){
    const response = await fetch(`/api/tracks/${trackId}/comments`);
    if (!response.ok){
      commentsList.innerHTML = '<div class="comment-empty">Не получилось загрузить комментарии.</div>';
      return;
    }
    const comments = await response.json();
    if (comments.length === 0){
      commentsList.innerHTML = '<div class="comment-empty">Пока нет комментариев — будь первым.</div>';
      return;
    }
    commentsList.innerHTML = comments.map(c =>
      `<div class="comment-item"><span class="comment-author">${escapeHtml(c.username)}</span><span class="comment-text">${escapeHtml(c.text)}</span></div>`
    ).join('');
    commentsList.scrollTop = commentsList.scrollHeight;
  }

  document.getElementById('comments-close-btn').addEventListener('click', () => {
    commentsModalBackdrop.classList.remove('open');
  });

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!activeCommentsTrack) return;

    if (!currentUser){
      commentsModalBackdrop.classList.remove('open');
      openAuthModal();
      return;
    }

    const text = commentInput.value.trim();
    if (!text) return;

    const response = await fetch(`/api/tracks/${activeCommentsTrack.id}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    if (!response.ok){
      commentStatus.textContent = 'Не получилось отправить комментарий.';
      commentStatus.className = 'upload-status error';
      return;
    }

    commentInput.value = '';
    commentStatus.textContent = '';

    // Счётчик комментариев на карточке обновляем на месте, как и лайки —
    // без перезагрузки всего списка треков.
    activeCommentsTrack.comment_count = (activeCommentsTrack.comment_count || 0) + 1;
    const libT = libraryTracks.find(x => x.id === activeCommentsTrack.id);
    if (libT && libT !== activeCommentsTrack) libT.comment_count = activeCommentsTrack.comment_count;
    renderTrackCards();

    await loadComments(activeCommentsTrack.id);
  });

  // Библиотеку грузим всегда (пригодится для "Главная"/поиска), а если в адресе
  // страницы есть ?playlist=ID — значит, кто-то перешёл по ссылке "Поделиться"
  // на публичный плейлист, и сразу после библиотеки показываем его поверх.
  // await здесь важен: иначе оба запроса пришли бы вперемешку, и библиотека,

  (async () => {

  })();

  // ---------- Загрузка своего трека ----------
  const modalBackdrop = document.getElementById('modal-backdrop');

  document.getElementById('upload-open-btn').addEventListener('click', () => {

  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const title = document.getElementById('input-title').value;
    const artist = document.getElementById('input-artist').value;
    const file = document.getElementById('input-file').files[0];
    const cover = document.getElementById('input-cover').files[0];
    const genre = document.getElementById('input-genre').value;
    const description = document.getElementById('input-description').value;

    const formData = new FormData();
    formData.append('title', title);
    formData.append('artist', artist);
    formData.append('audioFile', file);
    if (cover) formData.append('cover', cover);
    if (genre) formData.append('genre', genre);
    if (description) formData.append('description', description);
    if (document.getElementById('input-private').checked) formData.append('isPrivate', 'true');

    uploadStatus.textContent = 'Загружаем...';
    uploadStatus.className = 'upload-status';

    try {
      const response = await fetch('/api/tracks', { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Сервер отклонил запрос');

      uploadStatus.textContent = 'Готово!';
      uploadStatus.className = 'upload-status success';

      await loadTracksFromServer();
      uploadForm.reset();
      setTimeout(() => {
        modalBackdrop.classList.remove('open');
        uploadStatus.textContent = '';
      }, 700);
    } catch (err) {
      uploadStatus.textContent = 'Ошибка загрузки. Попробуй ещё раз.';
      uploadStatus.className = 'upload-status error';

  // ---------- Регистрация / вход ----------
  const authArea = document.getElementById('auth-area');
  const authModalBackdrop = document.getElementById('auth-modal-backdrop');
  const authForm = document.getElementById('auth-form');
  const authStatus = document.getElementById('auth-status');

  let authMode = 'login';

  function renderAuthArea(user){
    currentUser = user;
    if (user){
      authArea.innerHTML = `

          <button class="auth-logout-btn" id="logout-btn">Выйти</button>

      navAdmin.style.display = user.is_admin ? '' : 'none';
    } else {

      document.getElementById('auth-open-btn').addEventListener('click', openAuthModal);
      renderPlaylistList([]);
      navAdmin.style.display = 'none';

    renderTrackCards();

  function openAuthModal(){ authModalBackdrop.classList.add('open'); }

  function setAuthMode(mode){
    authMode = mode;
    if (mode === 'login'){
      authModalTitle.textContent = 'Вход';
      authSubmitBtn.textContent = 'Войти';
      authSwitchBtn.textContent = 'Нет аккаунта? Регистрация';
    } else {
      authModalTitle.textContent = 'Регистрация';
      authSubmitBtn.textContent = 'Создать аккаунт';
      authSwitchBtn.textContent = 'Уже есть аккаунт? Войти';
    }
    authStatus.textContent = '';
  }

  authSwitchBtn.addEventListener('click', () => {
    setAuthMode(authMode === 'login' ? 'register' : 'login');
  });

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('auth-username').value;
    const password = document.getElementById('auth-password').value;
    const url = authMode === 'login' ? '/api/login' : '/api/register';

    authStatus.textContent = 'Подождите...';
    authStatus.className = 'upload-status';

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await response.json();

      if (!response.ok) {
        authStatus.textContent = data.error || 'Что-то пошло не так.';
        authStatus.className = 'upload-status error';
        return;
      }

      renderAuthArea(data);
      authForm.reset();
      authModalBackdrop.classList.remove('open');
      authStatus.textContent = '';
    } catch (err) {
      authStatus.textContent = 'Ошибка соединения с сервером.';
      authStatus.className = 'upload-status error';
    }
  });

  async function checkCurrentUser(){

    renderAuthArea(data.user);

  const playlistStatus = document.getElementById('playlist-status');
  const popover = document.getElementById('add-to-playlist-popover');

  let myPlaylists = [];

  async function loadPlaylists(){
    const response = await fetch('/api/playlists');
    if (!response.ok) return;
    myPlaylists = await response.json();
    renderPlaylistList(myPlaylists);
  }

  function renderPlaylistList(playlists){
    if (playlists.length === 0){
      playlistListEl.innerHTML = `<div class="playlist-item" style="cursor:default;">Пока нет плейлистов</div>`;
      return;
    }
    playlistListEl.innerHTML = playlists.map(p =>
      `<div class="playlist-item" data-playlist-id="${p.id}">${p.name}</div>`
    ).join('');

    playlistListEl.querySelectorAll('.playlist-item[data-playlist-id]').forEach(el => {
      el.addEventListener('click', () => openPlaylistView(el.dataset.playlistId, el.textContent));
    });
  }

  const sectionTitleText = document.getElementById('section-title-text');
  const backToLibraryLink = document.getElementById('back-to-library-link');

  const playlistHeader = document.getElementById('playlist-header');
  const playlistShareBtn = document.getElementById('playlist-share-btn');

  function hidePlaylistHeader(){ playlistHeader.style.display = 'none'; }

  async function openPlaylistView(playlistId, name){
    const response = await fetch(`/api/playlists/${playlistId}`);
    if (!response.ok) return;
    const data = await response.json();

    tracks = data.tracks;
    renderTrackCards();
    hideProfileHeader();
    sectionTitleText.textContent = name;
    backToLibraryLink.style.display = 'inline';

    // "Поделиться" показываем только для публичных плейлистов — по этой
    // ссылке сможет зайти кто угодно, даже без входа (см. openSharedPlaylist).
    if (data.is_public){
      playlistShareBtn.onclick = () => sharePlaylistLink(playlistId);
      playlistHeader.style.display = 'flex';
    } else {
      hidePlaylistHeader();
    }
  }

  function sharePlaylistLink(playlistId){
    const url = `${location.origin}/?playlist=${playlistId}`;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        () => { playlistShareBtn.textContent = 'Ссылка скопирована!'; setTimeout(() => playlistShareBtn.textContent = 'Поделиться ссылкой', 1500); },
        () => prompt('Скопируй ссылку:', url)
      );
    } else {
      prompt('Скопируй ссылку:', url);
    }
  }

  // Открыть публичный плейлист по ссылке ?playlist=ID — работает для всех,
  // даже без входа (это отдельный маршрут /public на сервере).
  async function openSharedPlaylist(playlistId){
    const response = await fetch(`/api/playlists/${playlistId}/public`);
    if (!response.ok) return;
    const data = await response.json();

    tracks = data.tracks;
    renderTrackCards();
    hideProfileHeader();
    setActiveNav(null);
    heroEl.style.display = '';
    searchInput.style.display = 'none';
    sectionTitleText.textContent = data.name + ' — ' + data.owner_username;
    backToLibraryLink.style.display = 'inline';
    hidePlaylistHeader();
  }

  backToLibraryLink.addEventListener('click', async () => {
    sectionTitleText.textContent = 'Библиотека';

  // ---------- Профиль пользователя (его загруженные треки, подписчики) ----------
  const profileHeader = document.getElementById('profile-header');
  const profileStats = document.getElementById('profile-stats');
  const profileFollowBtn = document.getElementById('profile-follow-btn');
  const similarArtistsEl = document.getElementById('similar-artists');

  let profileState = null; // { userId, isFollowed, followersCount, followingCount }

  function hideProfileHeader(){
    profileHeader.style.display = 'none';
    similarArtistsEl.style.display = 'none';
    hidePlaylistHeader();
    profileState = null;
  }

  // "Похоже на" — короткий ряд других исполнителей, посчитанный сервером
  // (по совпадающим лайкам слушателей, либо по общему жанру).
  async function loadSimilarArtists(username){
    const response = await fetch(`/api/users/${encodeURIComponent(username)}/similar`);
    if (!response.ok){ similarArtistsEl.style.display = 'none'; return; }
    const data = await response.json();
    if (!data.artists.length){ similarArtistsEl.style.display = 'none'; return; }

    similarArtistsEl.innerHTML = '<span>Похоже на:</span> ' + data.artists.map(a =>
      `<span class="chip" data-username="${escapeHtml(a)}">${escapeHtml(a)}</span>`
    ).join('');
    similarArtistsEl.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => openProfileView(chip.dataset.username));
    });
    similarArtistsEl.style.display = 'flex';
  }

  function renderProfileHeader(){
    profileStats.textContent = `${profileState.followersCount} подписчиков · ${profileState.followingCount} подписок`;
    if (profileState.showFollowBtn){
      profileFollowBtn.style.display = '';
      profileFollowBtn.textContent = profileState.isFollowed ? 'Отписаться' : 'Подписаться';
    } else {
      profileFollowBtn.style.display = 'none';
    }
    profileHeader.style.display = 'flex';
  }

  async function openProfileView(username){
    const response = await fetch(`/api/users/${encodeURIComponent(username)}`);
    if (!response.ok) return;
    const data = await response.json();

    tracks = data.tracks;
    renderTrackCards();
    setActiveNav(null);
    heroEl.style.display = '';
    searchInput.style.display = 'none';
    sectionTitleText.textContent = 'Треки: ' + data.user.username;
    backToLibraryLink.style.display = 'inline';

    const isOwnProfile = currentUser && currentUser.id === data.user.id;
    profileState = {
      userId: data.user.id,
      isFollowed: data.user.is_followed_by_me,
      followersCount: data.user.followers_count,
      followingCount: data.user.following_count,
      showFollowBtn: !isOwnProfile
    };
    renderProfileHeader();
    loadSimilarArtists(username);
  }

  profileFollowBtn.addEventListener('click', async () => {
    if (!currentUser){ openAuthModal(); return; }
    if (!profileState) return;

    const method = profileState.isFollowed ? 'DELETE' : 'POST';
    const response = await fetch(`/api/users/${profileState.userId}/follow`, { method });
    if (!response.ok) return;

    profileState.isFollowed = !profileState.isFollowed;
    profileState.followersCount += profileState.isFollowed ? 1 : -1;
    renderProfileHeader();
  });

  document.getElementById('new-playlist-btn').addEventListener('click', () => {
    playlistModalBackdrop.classList.add('open');
  });
  document.getElementById('playlist-cancel-btn').addEventListener('click', () => {
    playlistModalBackdrop.classList.remove('open');
  });

  playlistForm.addEventListener('submit', async (e) => {

    const isPublic = document.getElementById('playlist-public-input').checked;

  function openAddToPlaylistPopover(buttonEl, trackId){
    if (myPlaylists.length === 0){
      popover.innerHTML = `<div class="popover-empty">Сначала создай плейлист (кнопка «+» в сайдбаре)</div>`;
    } else {
      popover.innerHTML = myPlaylists.map(p =>
        `<div class="popover-item" data-playlist-id="${p.id}">${p.name}</div>`
      ).join('');

    const rect = buttonEl.getBoundingClientRect();
    popover.style.top = (rect.bottom + 6) + 'px';
    popover.style.left = Math.min(rect.left, window.innerWidth - 210) + 'px';

      item.addEventListener('click', async () => {
        const playlistId = item.dataset.playlistId;
        await fetch(`/api/playlists/${playlistId}/tracks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },

        });

  document.addEventListener('click', (e) => {

  [modalBackdrop, authModalBackdrop, playlistModalBackdrop, commentsModalBackdrop].forEach(backdrop => {

  // ---------- Плеер ----------
  function fmt(sec){
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }

  // Ставим обложку на плеере снизу и в блоке "Сейчас играет": если есть настоящая
  // картинка — показываем её, иначе — прежний цветной градиент с буквами.
  function setCoverEl(el, t){
    el.style.backgroundImage = t.cover_path ? "url('" + t.cover_path + "')" : '';
    el.style.background = t.cover_path ? '' : coverBg(t.color);
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.textContent = t.cover_path ? '' : initials(t.title);
  }

  function loadTrack(i, autoplay){
    document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing'));
    currentIndex = i;
    const t = tracks[i];
    audio.src = t.src;

    // Плеер снизу
    setCoverEl(npCover, t);
    npTitle.textContent = t.title;
    npArtist.textContent = t.artist;

    // Герой «Сейчас играет»
    setCoverEl(heroCover, t);
    heroTitle.textContent = t.title;
    heroArtist.textContent = t.artist;

    const card = document.getElementById('card-' + i);
    if (card) card.classList.add('playing');

    if (autoplay){
      audio.play();
      // Считаем прослушивание в момент реального старта нового трека
      // (а не при каждой паузе/возобновлении одного и того же трека).
      fetch(`/api/tracks/${t.id}/play`, { method: 'POST' }).catch(() => {});
    }
  }

  function setPlayingState(playing){
    isPlaying = playing;
    heroEq.classList.toggle('playing', playing);
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  playBtn.addEventListener('click', () => {
    if (currentIndex === -1){ if (tracks.length) loadTrack(0, true); return; }
    if (audio.paused){ audio.play(); } else { audio.pause(); }

  document.getElementById('next-btn').addEventListener('click', () => {
    if (!tracks.length) return;
    const next = currentIndex === -1 ? 0 : (currentIndex + 1) % tracks.length;
    loadTrack(next, true);
  });

  document.getElementById('prev-btn').addEventListener('click', () => {
    if (!tracks.length) return;
    const prev = currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1;
    loadTrack(prev, true);
  });

  audio.addEventListener('play', () => setPlayingState(true));
  audio.addEventListener('pause', () => setPlayingState(false));
  audio.addEventListener('ended', () => {
    if (!tracks.length) return;
    const next = (currentIndex + 1) % tracks.length;
    loadTrack(next, true);
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    timeCurrent.textContent = fmt(audio.currentTime);

  audio.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = fmt(audio.duration);

    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;

  // ---------- Навигация: Главная / Поиск / Библиотека / Лента ----------
  const navItemsAll = document.querySelectorAll('.nav-item');
  const navHome = document.getElementById('nav-home');
  const navSearch = document.getElementById('nav-search');
  const navLibrary = document.getElementById('nav-library');
  const navFeed = document.getElementById('nav-feed');
  const navAdmin = document.getElementById('nav-admin');
  const adminReportsView = document.getElementById('admin-reports-view');
  const heroEl = document.querySelector('.hero');
  const searchInput = document.getElementById('search-input');

  function setActiveNav(el){
    navItemsAll.forEach(n => n.classList.remove('active'));
    if (el) el.classList.add('active');
  }

  // Показать полную библиотеку (используется и «Главной», и «Библиотекой»).
  function showLibraryView(title, activeEl){
    setActiveNav(activeEl);
    sectionTitleText.textContent = title;
    backToLibraryLink.style.display = 'none';
    hideProfileHeader();
    heroEl.style.display = '';
    searchInput.style.display = 'none';
    searchInput.value = '';
    tracks = libraryTracks;
    renderTrackCards();
  }

  function goHome(){ showLibraryView('Главная', navHome); }
  function goLibrary(){ showLibraryView('Библиотека', navLibrary); }

  function goSearch(){
    setActiveNav(navSearch);
    sectionTitleText.textContent = 'Поиск';
    backToLibraryLink.style.display = 'none';
    hideProfileHeader();
    heroEl.style.display = 'none';           // в поиске герой прячем, чтобы не мешал
    searchInput.style.display = '';
    searchInput.focus();
    applySearch();
  }

  // Поиск теперь спрашивает сервер (по названию, исполнителю И жанру, а не только
  // по тому, что уже загружено в браузер) — с небольшой задержкой (debounce),
  // чтобы не слать запрос на каждую нажатую букву.
  let searchDebounceTimer = null;

  function applySearch(){
    const q = searchInput.value.trim();
    clearTimeout(searchDebounceTimer);

    if (!q){
      tracks = libraryTracks.slice();
      renderTrackCards();
      return;
    }

    searchDebounceTimer = setTimeout(async () => {
      const response = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      if (!response.ok) return;
      const data = await response.json();
      tracks = data.tracks;
      renderTrackCards();
    }, 250);
  }

  // Лента доступна только вошедшим — без входа просто открываем окно логина.
  async function goFeed(){
    if (!currentUser){ openAuthModal(); return; }

    setActiveNav(navFeed);
    sectionTitleText.textContent = 'Лента';
    backToLibraryLink.style.display = 'none';
    hideProfileHeader();
    heroEl.style.display = '';
    searchInput.style.display = 'none';
    searchInput.value = '';

    const response = await fetch('/api/feed');
    tracks = response.ok ? await response.json() : [];
    renderTrackCards();
  }

  // ---------- Админ-панель: список открытых жалоб ----------
  function hideAdminReports(){
    adminReportsView.style.display = 'none';
  }

  async function goAdminReports(){
    if (!currentUser || !currentUser.is_admin) return;

    setActiveNav(navAdmin);
    sectionTitleText.textContent = 'Жалобы';
    backToLibraryLink.style.display = 'none';
    hideProfileHeader();
    heroEl.style.display = 'none';
    searchInput.style.display = 'none';
    grid.style.display = 'none';
    adminReportsView.style.display = 'flex';

    await loadAdminReports();
  }

  async function loadAdminReports(){
    const response = await fetch('/api/admin/reports');
    if (!response.ok){
      adminReportsView.innerHTML = '<div class="comment-empty">Не получилось загрузить жалобы.</div>';
      return;
    }
    const reports = await response.json();
    if (reports.length === 0){
      adminReportsView.innerHTML = '<div class="comment-empty">Открытых жалоб нет.</div>';
      return;
    }

    adminReportsView.innerHTML = reports.map(r => `
      <div class="report-item" data-report-id="${r.id}">
        <div><strong>${escapeHtml(r.track_title)}</strong> — ${escapeHtml(r.track_artist)}</div>
        <div class="report-reason">Пожаловался(-ась): ${escapeHtml(r.reporter_username)} · Причина: ${escapeHtml(r.reason)}</div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary dismiss-report-btn">Отклонить</button>
          <button type="button" class="btn-primary delete-reported-track-btn" style="background:var(--danger);">Удалить трек</button>
        </div>
      </div>
    `).join('');

    adminReportsView.querySelectorAll('.dismiss-report-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const reportId = e.target.closest('.report-item').dataset.reportId;
        await fetch(`/api/admin/reports/${reportId}/dismiss`, { method: 'POST' });
        loadAdminReports();
      });
    });
    adminReportsView.querySelectorAll('.delete-reported-track-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        if (!confirm('Удалить этот трек? Это действие нельзя отменить.')) return;
        const reportId = e.target.closest('.report-item').dataset.reportId;
        await fetch(`/api/admin/reports/${reportId}/delete-track`, { method: 'POST' });
        loadAdminReports();
      });
    });
  }

  navAdmin.addEventListener('click', goAdminReports);

  navHome.addEventListener('click', goHome);
  navLibrary.addEventListener('click', goLibrary);
  navSearch.addEventListener('click', goSearch);
  navFeed.addEventListener('click', goFeed);
  searchInput.addEventListener('input', applySearch);

  // Клик (и Enter) по логотипу — возврат на главную.
  const logoHome = document.getElementById('logo-home');
  logoHome.addEventListener('click', goHome);
  logoHome.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); } });
</script>

</body>
</html>
